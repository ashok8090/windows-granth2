name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        run: flutter create --platforms=windows .

      - name: Dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

      - name: Zip launcher
        shell: pwsh
        run: |
          if (-not (Test-Path "build/windows/x64/runner/Release")) { throw "Release folder missing" }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Granth-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Granth-Windows
          path: Granth-Windows.zip
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: Granth Prabandhan Windows ${{ github.run_number }}
          files: Granth-Windows.zip
          body: |
            Windows launcher of Granth Prabandhan.
            Unzip and run granthprabandhan.exe. Same Flutter app as Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
